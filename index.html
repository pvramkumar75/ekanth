  for(const id of ["pinerr","autherr","editmsg","shareerr"])say(id,"");
  show(CURRENT?"open":"locked");
}
$("adminbtn").addEventListener("click",()=>openAdmin("pin"));
$("adminclose").addEventListener("click",closeAdmin);

$("pinform").addEventListener("submit",async e=>{
  e.preventDefault();
  if(Date.now()<pinWaitUntil){say("pinerr","Too many tries. Wait a few seconds.");return;}
  if(await sha256("ekanth189:"+$("pin").value)===PIN_HASH){
    pinTries=0;
    if(CURRENT&&CURPW){ADMIN={pw:CURPW,gate:CURRENT.gate,door:CURRENT.door};openAdmin("edit");}
    else openAdmin("auth");
    return;
  }
  pinTries++;$("pin").value="";
  if(pinTries>=5){pinTries=0;pinWaitUntil=Date.now()+30000;say("pinerr","Wrong PIN. Locked for 30 seconds.");}
  else say("pinerr","Wrong PIN.");
  shake($("pinrow"));
});

$("authform").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=$("curpw").value;
  if(!pw){say("autherr","Type the current card password first.");return;}
  $("authbtn").disabled=true;say("autherr","Checking…",true);
  try{const v=await openVault(pw);ADMIN={pw,gate:v.gate,door:v.door};$("curpw").value="";openAdmin("edit");}
  catch(_){say("autherr","That isn't the current card password.");shake($("authrow"));}
  finally{$("authbtn").disabled=false;}
});

for(const f of document.querySelectorAll("form.item")){
  f.querySelector("[data-edit]").addEventListener("click",()=>{say("editmsg","");openItem(f);});
  f.querySelector("[data-cancel]").addEventListener("click",()=>closeItem(f));
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const k=f.dataset.k,raw=f.querySelector("[data-in]").value,val=k==="pw"?raw:raw.trim();
    if(k==="pw"&&val.trim().length<4){say("editmsg","Use a card password of at least 4 characters.");return;}
    if(k!=="pw"&&!/^\d{3,8}$/.test(val)){say("editmsg",ITEMS[k]+" must be 3 to 8 digits.");return;}
    if(val===ADMIN[k]){say("editmsg","That's the same as now. Nothing to change.");return;}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    try{await saveAdmin({...ADMIN,[k]:val},k);}finally{btn.disabled=false;}
  });
}

// Re-encrypt the codes with the (possibly new) password and save the page.
async function saveAdmin(next,k){
  const label=ITEMS[k];
  say("editmsg","Encrypting…",true);
  try{
    const vault=await sealVault({gate:next.gate,door:next.door},next.pw);
    const back=await openVault(next.pw,vault);
    if(back.gate!==next.gate||back.door!==next.door)throw new Error("check");
    const onClaude=!!(window.claude&&window.claude.use);
    const artifact=onClaude?await window.claude.use("artifact"):null;
    if(onClaude&&!artifact){say("editmsg","Only the card owner can make changes. Open the card from Ram's claude.ai account.");return;}
    if(!artifact){
      // Static hosting (Vercel): hand the admin the updated page to upload to GitHub; Vercel redeploys it.
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([buildDoc(vault)],{type:"text/html"}));a.download="index.html";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
      VAULT=vault;ADMIN=next;renderEditor();
      say("editmsg",label+" changed in a new index.html (downloaded). Upload it to the ekanth GitHub repo, replacing index.html; the site updates in about a minute.",true);
      return;
    }
    try{sessionStorage.setItem("ekanth-changed",JSON.stringify({pw:next.pw,k,t:Date.now()}));}catch(_){}
    say("editmsg","Saving…",true);
    await artifact.publish(buildDoc(vault));
    VAULT=vault;ADMIN=next;renderEditor();
    say("editmsg",doneText(k),true);
  }catch(err){
    try{sessionStorage.removeItem("ekanth-changed");}catch(_){}
    const code=err&&err.code;
    if(code==="not_granted"||code==="not_writer")say("editmsg","Only the card owner can make changes. Open the card from Ram's claude.ai account.");
    else if(code==="conflict")say("editmsg","The card was updated somewhere else at the same moment. Close admin and try again.");
    else say("editmsg","Couldn't save. Nothing was changed. Try again.");
  }
}
function doneText(k){return ITEMS[k]+" changed for everyone."+(k==="pw"?" Share the new password below.":"");}

function shareText(){return "Ekanth 189 farmhouse key card\nOpen: "+LINK+"\nPassword: "+(ADMIN?ADMIN.pw:"");}
function updateShare(){
  const t=shareText();$("msg").value=t;
  $("wa").href="https://wa.me/?text="+encodeURIComponent(t);
}
$("copybtn").addEventListener("click",async()=>{
  const t=shareText();
  try{await navigator.clipboard.writeText(t);say("shareerr","Message copied.",true);}
  catch(_){$("msg").focus();$("msg").select();
    try{document.execCommand("copy");say("shareerr","Message copied.",true);}catch(__){say("shareerr","Select the message above and copy it.");}}
});
if(navigator.share){$("sharebtn").hidden=false;
  $("sharebtn").addEventListener("click",()=>navigator.share({title:"Ekanth 189 Key Card",text:shareText()}).catch(()=>{}));}

// After a change the page reloads to the new version; reopen the admin settings for the admin who just saved.
(async()=>{
  try{
    const j=JSON.parse(sessionStorage.getItem("ekanth-changed")||"null");
    sessionStorage.removeItem("ekanth-changed");
    if(!j||Date.now()-j.t>10*60*1000)return;
    const v=await openVault(j.pw);ADMIN={pw:j.pw,gate:v.gate,door:v.door};
    openAdmin("edit");say("editmsg",doneText(j.k),true);
  }catch(_){}
})();

// ---- Jungle at night (canvas) ----
const cv=$("jungle"),ctx=cv.getContext("2d");
let W,H,DPR,seed,flies=[];
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function size(){DPR=Math.min(window.devicePixelRatio||1,3);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  seed=189;flies=Array.from({length:22},()=>({x:rnd()*W,y:H*0.35+rnd()*H*0.5,p:rnd()*6.28,s:.3+rnd()*.6}));}
function canopy(y,col,scale,count){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let i=0;i<=count;i++){const x=i/count*W;const h=y-rnd()*40*scale;ctx.arc(x,h,(18+rnd()*26)*scale,Math.PI,0);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function palm(x,base,h,col,lean){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,h/40);ctx.lineCap="round";
  const tx=x+lean,ty=base-h;ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+lean*.2,base-h*.6,tx,ty);ctx.stroke();
  ctx.fillStyle=col;
  for(let k=0;k<7;k++){const a=-Math.PI+k*(Math.PI/6)+(rnd()-.5)*.3;const L=h*(.32+rnd()*.12);
    ctx.beginPath();ctx.moveTo(tx,ty);
    ctx.quadraticCurveTo(tx+Math.cos(a)*L*.6,ty+Math.sin(a)*L*.6-L*.25,tx+Math.cos(a)*L,ty+Math.sin(a)*L*.4+L*.25);
    ctx.quadraticCurveTo(tx+Math.cos(a)*L*.5,ty+Math.sin(a)*L*.5-L*.05,tx,ty);ctx.fill();}
}
function house(cx,base){
  const w=78,h=40;
  ctx.fillStyle="#0a1710";
  ctx.beginPath();ctx.moveTo(cx-w/2-10,base-h);ctx.lineTo(cx,base-h-30);ctx.lineTo(cx+w/2+10,base-h);ctx.closePath();ctx.fill();
  ctx.fillRect(cx-w/2,base-h,w,h);
  const glow=(x,y,ww,hh)=>{const g=ctx.createRadialGradient(x+ww/2,y+hh/2,1,x+ww/2,y+hh/2,40);g.addColorStop(0,"rgba(255,196,110,.45)");g.addColorStop(1,"rgba(255,196,110,0)");
    ctx.fillStyle=g;ctx.fillRect(x-40,y-40,ww+80,hh+80);ctx.fillStyle="#ffd28a";ctx.fillRect(x,y,ww,hh);};
  glow(cx-28,base-h+10,12,11);glow(cx+16,base-h+10,12,11);
  ctx.fillStyle="#e9b866";ctx.fillRect(cx-6,base-20,12,20);
  ctx.fillStyle="#0a1710";ctx.fillRect(cx+w/2-18,base-h-30,7,16);
}
function draw(t){
  seed=189;
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#081a1a");sky.addColorStop(.55,"#123329");sky.addColorStop(1,"#0b1a13");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const x=rnd()*W,y=rnd()*H*.45,r=rnd()*1.2+.2;ctx.globalAlpha=.3+.5*Math.abs(Math.sin(t/1400+i));ctx.fillStyle="#fff";ctx.fillRect(x,y,r,r);}
  ctx.globalAlpha=1;
  const mx=W*.78,my=H*.17;const mg=ctx.createRadialGradient(mx,my,4,mx,my,90);mg.addColorStop(0,"rgba(244,234,210,.35)");mg.addColorStop(1,"rgba(244,234,210,0)");
  ctx.fillStyle=mg;ctx.fillRect(mx-90,my-90,180,180);ctx.fillStyle="#f4ead2";ctx.beginPath();ctx.arc(mx,my,17,0,7);ctx.fill();
  canopy(H*.50,"#173a2c",1.2,9);
  const mist=ctx.createLinearGradient(0,H*.45,0,H*.7);mist.addColorStop(0,"rgba(160,200,180,0)");mist.addColorStop(.5,"rgba(160,200,180,.10)");mist.addColorStop(1,"rgba(160,200,180,0)");
  ctx.fillStyle=mist;ctx.fillRect(0,H*.4,W,H*.35);
  palm(W*.12,H*.75,H*.42,"#10291f",-14);palm(W*.9,H*.78,H*.5,"#10291f",16);
  canopy(H*.64,"#0f271d",1,7);
  house(W*.5,H*.66);
  canopy(H*.86,"#0a1a13",.9,12);
  palm(W*.03,H*1.02,H*.6,"#06110c",22);palm(W*1.0,H*1.02,H*.55,"#06110c",-26);
  for(const f of flies){const a=.35+.65*Math.max(0,Math.sin(t/600*f.s+f.p));const x=f.x+Math.sin(t/2000+f.p)*10,y=f.y+Math.cos(t/2500+f.p)*6;
    const g=ctx.createRadialGradient(x,y,0,x,y,7);g.addColorStop(0,`rgba(230,255,150,${a})`);g.addColorStop(1,"rgba(230,255,150,0)");ctx.fillStyle=g;ctx.fillRect(x-7,y-7,14,14);}
  const fade=ctx.createLinearGradient(0,H*.6,0,H);fade.addColorStop(0,"rgba(7,18,13,0)");fade.addColorStop(1,"rgba(7,18,13,.95)");ctx.fillStyle=fade;ctx.fillRect(0,H*.6,W,H*.4);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(t){draw(t);if(!still)requestAnimationFrame(loop);}
size();addEventListener("resize",size);requestAnimationFrame(loop);
</script>
